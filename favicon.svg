<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect width="32" height="32" rx="7" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>

  <!-- Glass shine overlay at top -->
  <rect width="32" height="14" rx="7" fill="url(#shine)"/>

  <!-- NK monogram — glowing indigo/purple text -->
  <text
    x="16"
    y="21"
    dominant-baseline="auto"
    text-anchor="middle"
    fill="url(#glow)"
    font-family="'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-weight="700"
    font-size="14"
    letter-spacing="-0.5"
    filter="url(#glow-filter)"
  >NK</text>

  <!-- Crisp white layer on top for sharpness -->
  <text
    x="16"
    y="21"
    dominant-baseline="auto"
    text-anchor="middle"
    fill="rgba(255,255,255,0.92)"
    font-family="'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-weight="700"
    font-size="14"
    letter-spacing="-0.5"
  >NK</text>
</svg>
